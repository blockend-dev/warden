# Local Midnight devnet: node + indexer + proof server, all standalone
# (no public testnet, no faucet needed). Image tags, healthchecks, and
# service topology are taken directly from the official
# `midnightntwrk/example-counter` reference project (`counter-cli/standalone.yml`,
# fetched 2026-09-07 — see docs/IMPLEMENTATION-NOTES.md) rather than
# hand-assembled, so they're the ones Midnight's own examples are actually
# tested against. One deliberate change from the original: ports are pinned
# to fixed host ports (6300/8088/9944) instead of random ones, since nothing
# else on this machine needs to share them and fixed ports make the URLs
# below (and any manual curl/debugging) predictable.
#
# Usage: docker compose -f infra/devnet/standalone.yml --env-file infra/devnet/standalone.env up
services:
  proof-server:
    container_name: 'warden-proof-server'
    image: 'midnightntwrk/proof-server:8.0.3'
    command: ['midnight-proof-server -v']
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6300/version']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    container_name: 'warden-indexer'
    image: 'midnightntwrk/indexer-standalone:4.0.0'
    env_file: standalone.env
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: 'midnightntwrk/midnight-node:0.22.3'
    container_name: 'warden-node'
    ports:
      - '9944:9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
